name: DAVID Violent QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/violent-qa.yml'
      - '.github/qa/violent-qa.spec.ts'
      - 'netlify.toml'
      - 'package.json'
      - 'patch-job3-one-writer-fixes.cjs'
      - 'patch-job2-ux-v3.cjs'
      - 'patch-workbench-v2.cjs'
      - 'patch-mutation-staging-v2.cjs'
      - 'patch-slop-methods-staging-v2.cjs'
      - 'patch-synthesis-source-of-truth-v2.cjs'

jobs:
  violent-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAVID_BASE_URL: https://thedavidapp.netlify.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Build patched production bundle
        id: localbuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee local-build.log

      - name: Install Playwright for QA only
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Let Netlify publish this commit
        run: sleep 25

      - name: Browser QA
        id: browserqa
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test .github/qa/violent-qa.spec.ts --reporter=line 2>&1 | tee browser-qa.log

      - name: Capture patched source
        if: always()
        continue-on-error: true
        run: |
          cp src/App.tsx qa-patched-App.tsx
          cp src/components/PromptInputArea.tsx qa-patched-PromptInputArea.tsx
          cp src/components/DavidAppWorkbench.tsx qa-patched-DavidAppWorkbench.tsx
          cp src/components/InterfaceShell.tsx qa-patched-InterfaceShell.tsx

      - name: Single-writer static audit
        id: staticaudit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee static-audit.log
          const fs = require('fs');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const input = fs.readFileSync('src/components/PromptInputArea.tsx', 'utf8');
          const failures = [];

          const instrumentalStart = input.indexOf('id="toggle-instrumental-btn"');
          if (instrumentalStart >= 0) {
            const nextButton = input.indexOf('</button>', instrumentalStart);
            const chunk = input.slice(instrumentalStart, nextButton > instrumentalStart ? nextButton : instrumentalStart + 3500);
            if (/setConcept\s*\(/.test(chunk)) failures.push('Force Instrumental still writes MAIN PROMPT directly instead of routing through DAVID.');
            if (!/dispatchDavidIntent\s*\(/.test(chunk)) failures.push('Force Instrumental does not hand its decision to DAVID.');
          }

          const forbiddenAppFragments = [
            ['Zalgo direct write', /const handleInjectZalgo[\s\S]{0,900}setConcept\s*\(/],
            ['Preset direct write', /const handleSelectPreset[\s\S]{0,1200}setConcept\s*\(/],
            ['Ouroboros direct write', /const handleOuroborosLoop[\s\S]{0,1300}setConcept\s*\(/],
            ['Crossbreed direct write', /const handleCrossbreed[\s\S]{0,1300}setConcept\s*\(/],
          ];
          for (const [label, re] of forbiddenAppFragments) {
            if (re.test(app)) failures.push(label);
          }

          const promptIndex = input.indexOf('id="operative-concept-input"');
          const promptChunk = input.slice(Math.max(0, promptIndex - 250), promptIndex + 900);
          if (!/readOnly/.test(promptChunk)) failures.push('Visible MAIN PROMPT textarea is not read-only after patching.');
          if (/import\s+\{\s*ConsultChat\s*\}/.test(app) || /<ConsultChat\b/.test(app)) failures.push('Legacy ConsultChat is still mounted or imported after cleanup.');
          if (!/import\s+\{\s*DavidAppWorkbench\s*\}/.test(app)) failures.push('DAVID app workbench import is missing after patching.');
          if (!/<DavidAppWorkbench\b/.test(app)) failures.push('DAVID app workbench mount is missing after patching.');
          if (!/workbenchSourceOfTruth:\s*true/.test(app)) failures.push('Synthesis payload does not declare the workbench as source of truth.');
          if (!/enableMutationEngine:\s*false/.test(app)) failures.push('Synthesis can still secretly re-apply mutation state.');

          const mountAt = app.indexOf('<DavidAppWorkbench');
          console.log('DAVID workbench mount offset:', mountAt);
          if (mountAt >= 0) console.log(app.slice(Math.max(0, mountAt - 250), mountAt + 850));

          if (failures.length) {
            console.error('\nDAVID ONE-WRITER AUDIT FAILED:');
            failures.forEach((f) => console.error(' - ' + f));
            process.exit(1);
          }
          console.log('DAVID one-writer static audit passed.');
          NODE

      - name: Record raw QA outcomes
        if: always()
        run: |
          {
            echo "build=${{ steps.localbuild.outcome }}"
            echo "browser=${{ steps.browserqa.outcome }}"
            echo "static=${{ steps.staticaudit.outcome }}"
          } | tee qa-outcomes.txt

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: david-violent-qa-evidence
          path: |
            test-results/**/*.png
            browser-qa.log
            local-build.log
            static-audit.log
            qa-outcomes.txt
            qa-patched-App.tsx
            qa-patched-PromptInputArea.tsx
            qa-patched-DavidAppWorkbench.tsx
            qa-patched-InterfaceShell.tsx
          if-no-files-found: warn

      - name: Final QA gate
        if: always()
        run: |
          cat qa-outcomes.txt
          if [ "${{ steps.localbuild.outcome }}" != "success" ] || [ "${{ steps.browserqa.outcome }}" != "success" ] || [ "${{ steps.staticaudit.outcome }}" != "success" ]; then
            exit 1
          fi
